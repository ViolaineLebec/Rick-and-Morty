name: Intégration continue pour les tests
on: 
  push:
    branches: [tests]

jobs:
  frontend :
    runs-on: ubuntu-latest
    steps:
    - name: checkout github
      uses: actions/checkout@v7
    - name: installation de Node js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        package-manager-cache: false # Disable automatic npm caching if not required
    - name: Installlation des dépendances
      run: npm ci
    # - run: npx vitest run src/app/shared/components/header/header.spec.ts
    - name: lint eslint
      run: npm run lint
