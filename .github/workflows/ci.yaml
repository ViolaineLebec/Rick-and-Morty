name: Intégration continue pour les tests
on: 
  push:
    branches: [tests]

jobs:
  frontend :
    runs-on: ubuntu-latest
    steps:
    - name: checkout github
      uses: actions/checkout@v7
    - name: installation de Node js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        package-manager-cache: false # Disable automatic npm caching if not required
    - name: Installlation des dépendances
      run: npm ci
    - name: lint eslint
      run: npm run lint
    - name: tests 
      run: npm run test
    - name: build
      run: npm run build
    - name: Upload des artifacts de build
      uses: actions/upload-artifact@v4
      with:
        name: build-dist
        path: dist/
        retention-days: 7
